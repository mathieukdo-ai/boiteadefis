<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Boîte à Défis</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    :root {
      --bg-primary: #1e1b4b;
      --card-bg: #2e1065;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #ffffff;
      --text-muted: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2e1065, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #fbbf24;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .stars-counter {
      margin-top: 8px;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.1);
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }

    .challenge-category {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .challenge-text {
      font-size: 1.4rem;
      font-weight: bold;
      line-height: 1.4;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .timer-display {
      font-size: 2rem;
      font-weight: bold;
      color: #34d399;
      margin-bottom: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      background: #4338ca;
    }

    button:active {
      transform: translateY(0);
    }

    .btn-main {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      font-size: 1.2rem;
      padding: 16px 28px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-main:hover {
      background: linear-gradient(135deg, #d97706, #db2777);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.15);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.25);
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>✨ La Boîte à Défis ✨</h1>
    <div class="stars-counter">Étoiles gagnées : <span id="stars">0</span> ⭐</div>
  </header>

  <div class="card">
    <div id="category" class="challenge-category">Prêtes à jouer ?</div>
    <div id="challenge" class="challenge-text">Appuyez sur le bouton ci-dessous pour piocher un défi !</div>
    <div id="timer" class="timer-display" style="display:none;">00:30</div>

    <div class="btn-group" style="flex-direction: column;">
      <button class="btn-main" onclick="drawChallenge()">🎲 Tirer un Défi !</button>
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn-secondary" onclick="speakText()">🔊 Écouter</button>
        <button class="btn-secondary" id="timerBtn" onclick="startTimer()" style="display:none;">⏱️ Chrono</button>
        <button class="btn-secondary" onclick="completeChallenge()">✅ Réussi !</button>
      </div>
    </div>
  </div>

  <script>
    const challenges = [
      { cat: "🏃 Mouvement", text: "Faire 5 sauts de grenouille sans s'arrêter !", time: 30 },
      { cat: "🎭 Duo & Mime", text: "Mimer un animal chacun votre tour : l'autre doit deviner !", time: 60 },
      { cat: "🎨 Créativité", text: "Trouver 3 objets rouges dans la pièce en moins de 30 secondes !", time: 30 },
      { cat: "🧠 Énigme", text: "Qu'est-ce qui a des clés mais ne peut ouvrir aucune porte ? (Un piano !)", time: 40 },
      { cat: "🏃 Mouvement", text: "Tenir en équilibre sur un pied pendant 20 secondes comme un flamant rose !", time: 20 },
      { cat: "🎭 Duo & Mime", text: "Inventer une poignée de main secrète ensemble et la répéter 2 fois !", time: 40 },
      { cat: "🎨 Créativité", text: "Faire le plus bel origami ou dessin rapide en 1 minute !", time: 60 },
      { cat: "🏃 Mouvement", text: "Faire le tour de la table en marchant à reculons prudemment !", time: 30 }
    ];

    let currentChallenge = null;
    let stars = parseInt(localStorage.getItem('defis_stars') || '0');
    let timerInterval = null;
    let timeLeft = 0;

    document.getElementById('stars').innerText = stars;

    // Web Audio API pour les effets sonores
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, duration, type = 'sine') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function drawChallenge() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playSound(440, 0.1);
      
      clearInterval(timerInterval);
      document.getElementById('timer').style.display = 'none';

      const rand = Math.floor(Math.random() * challenges.length);
      currentChallenge = challenges[rand];

      document.getElementById('category').innerText = currentChallenge.cat;
      document.getElementById('challenge').innerText = currentChallenge.text;
      
      document.getElementById('timerBtn').style.display = 'inline-block';
      timeLeft = currentChallenge.time;
    }

    function speakText() {
      if (!currentChallenge) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(currentChallenge.text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function startTimer() {
      clearInterval(timerInterval);
      const timerEl = document.getElementById('timer');
      timerEl.style.display = 'block';
      
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playSound(880, 0.4, 'triangle');
          timerEl.innerText = "Temps écoulé ! 🔔";
        } else {
          playSound(300, 0.05);
          const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
          const secs = String(timeLeft % 60).padStart(2, '0');
          timerEl.innerText = `${mins}:${secs}`;
          timeLeft--;
        }
      }, 1000);
    }

    function completeChallenge() {
      if (!currentChallenge) return;
      stars += 1;
      localStorage.setItem('defis_stars', stars);
      document.getElementById('stars').innerText = stars;
      
      // Son de victoire
      playSound(523.25, 0.1);
      setTimeout(() => playSound(659.25, 0.1), 100);
      setTimeout(() => playSound(783.99, 0.3), 200);

      launchConfetti();
    }

    // Animation Confetti
    function launchConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 80 }).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        color: ['#f59e0b', '#ec4899', '#3b82f6', '#10b981', '#8b5cf6'][Math.floor(Math.random() * 5)],
        size: Math.random() * 8 + 4,
        speed: Math.random() * 4 + 2
      }));

      let frames = 0;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speed;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        frames++;
        if (frames < 120) requestAnimationFrame(render);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      render();
    }

    // Enregistrement du Service Worker pour le mode PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
