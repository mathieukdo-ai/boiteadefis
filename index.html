<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Boîte à Défis</title>
  <meta name="theme-color" content="#4f46e5">
  <style>
    :root {
      --bg-primary: #1e1b4b;
      --card-bg: #2e1065;
      --accent: #f59e0b;
      --text: #ffffff;
      --text-muted: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2e1065, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #fbbf24;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .stars-counter {
      margin-top: 8px;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.1);
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 480px;
      margin-top: 16px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: #f59e0b;
      color: #0f172a;
      font-weight: bold;
      border-color: #f59e0b;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      transition: transform 0.2s ease;
    }

    .card.draw-anim {
      animation: popCard 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popCard {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }

    .challenge-category {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .challenge-text {
      font-size: 1.4rem;
      font-weight: bold;
      line-height: 1.4;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .timer-display {
      font-size: 2rem;
      font-weight: bold;
      color: #34d399;
      margin-bottom: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      background: #4338ca;
    }

    button:active {
      transform: translateY(0);
    }

    .btn-main {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      font-size: 1.2rem;
      padding: 16px 28px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-main:hover {
      background: linear-gradient(135deg, #d97706, #db2777);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.15);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.25);
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>✨ La Boîte à Défis ✨</h1>
    <div class="stars-counter">Étoiles gagnées : <span id="stars">0</span> ⭐</div>
    
    <div class="filter-group">
      <button class="filter-btn active" onclick="setCategory('Tous', this)">🎲 Tous</button>
      <button class="filter-btn" onclick="setCategory('🏃 Mouvement', this)">🏃 Mouvement</button>
      <button class="filter-btn" onclick="setCategory('🎭 Duo & Mime', this)">🎭 Duo & Mime</button>
      <button class="filter-btn" onclick="setCategory('🎨 Créativité', this)">🎨 Créativité</button>
      <button class="filter-btn" onclick="setCategory('🧠 Énigme', this)">🧠 Énigme</button>
    </div>
  </header>

  <div class="card" id="cardElement">
    <div id="category" class="challenge-category">Prêtes à jouer ?</div>
    <div id="challenge" class="challenge-text">Appuyez sur le bouton ci-dessous pour piocher un défi !</div>
    <div id="timer" class="timer-display" style="display:none;">00:30</div>

    <div class="btn-group" style="flex-direction: column;">
      <button class="btn-main" onclick="drawChallenge()">🎲 Tirer un Défi !</button>
      <div class="btn-group" style="margin-top: 10px;">
        <button class="btn-secondary" onclick="speakText()">🔊 Écouter</button>
        <button class="btn-secondary" id="timerBtn" onclick="startTimer()" style="display:none;">⏱️ Chrono</button>
        <button class="btn-secondary" onclick="completeChallenge()">✅ Réussi !</button>
      </div>
    </div>
  </div>
